<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b0e13;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .doc{position:absolute;width:322px;height:206px;border-radius:10px;background:#f7f9fc;
    box-shadow:0 18px 44px rgba(0,0,0,.45);overflow:hidden;opacity:0}
  .doc .hd{height:26px;background:#dde5f2;display:flex;align-items:center;gap:6px;padding:0 10px}
  .doc .hd i{width:26px;height:6px;border-radius:3px;background:#b9c7dc}
  .doc .hd i:nth-child(2){width:48px;background:#cfdAea}
  .doc .bd{padding:12px 14px}
  .doc .bd span{display:block;height:7px;border-radius:4px;background:#e4eaf3;margin-bottom:9px}
  .doc .bd span:nth-child(2){width:72%}
  .doc .bd span:nth-child(3){width:88%}
  .doc .bd span:nth-child(4){width:54%}
  .doc .bd b{display:block;margin-top:12px;height:12px;width:44%;border-radius:3px;background:#cfdAea}
  .scrim{position:absolute;inset:0;background:#070a0e;opacity:0;z-index:8}
  .warn{position:absolute;left:0;right:0;bottom:196px;z-index:9;text-align:center;opacity:0;
    font-size:46px;font-weight:700;letter-spacing:6px;color:#ff5f5f;
    text-shadow:0 0 40px rgba(255,95,95,.4)}
  .cap{position:absolute;left:50%;bottom:52px;z-index:9;padding:16px 34px;border-radius:40px;
    background:rgba(8,12,18,.82);border:1px solid rgba(255,255,255,.09);
    color:#f3f6fb;font-size:38px;letter-spacing:1px;white-space:nowrap;opacity:0;
    transform:translateX(-50%)}
</style>
</head>
<body id="body">
<div class="scrim" id="scrim"></div>
<div class="warn" id="warn">错一个数 · 整张发票重来</div>
<div class="cap" id="cap">数据散在十几个页面，抄一遍、算一遍、再核对一遍</div>
<script type="module">
const D = 7.2;
let seed = 20261119;
const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

const docs = [];
for (let i = 0; i < 18; i++) {
  const d = document.createElement("div");
  d.className = "doc";
  d.innerHTML = '<div class="hd"><i></i><i></i></div><div class="bd"><span></span><span></span><span></span><span></span><b></b></div>';
  document.body.appendChild(d);
  const ang = rnd();
  docs.push({
    el: d,
    x: Math.round(70 + rnd() * 1360),
    y: Math.round(70 + rnd() * 700),
    r: (rnd() - 0.5) * 22,
    from: ang > 0.5 ? 1 : -1,
    delay: i * 0.26,
  });
}

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const fade = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

function frame(t) {
  docs.forEach((d, i) => {
    const p = ease((t - d.delay) / 0.5);
    if (p <= 0) { d.el.style.opacity = "0"; return; }
    const dx = (1 - p) * 1500 * d.from;
    const dy = (1 - p) * (i % 2 ? -420 : 380);
    d.el.style.opacity = String(0.55 + 0.35 * p);
    d.el.style.transform =
      `translate(${(d.x + dx).toFixed(1)}px,${(d.y + dy).toFixed(1)}px) rotate(${(d.r * p).toFixed(2)}deg)`;
  });
  document.getElementById("scrim").style.opacity = String(0.55 * fade(t, 4.7, 5.7));
  const w = document.getElementById("warn");
  w.style.opacity = String(fade(t, 5.0, 5.6));
  w.style.transform = `translateY(${(1 - fade(t, 5.0, 5.6)) * 18}px)`;
  document.getElementById("cap").style.opacity = String(fade(t, 0.4, 0.9));
}
window.film = { frame };
</script>
</body>
</html>
